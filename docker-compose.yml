version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: smartplanner-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smartplanner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartplanner_dev}
      POSTGRES_DB: ${POSTGRES_DB:-smartplanner}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smartplanner}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
